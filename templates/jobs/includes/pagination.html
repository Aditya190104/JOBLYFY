{% load joblyfy %}
{% if page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a class="button button-quiet small"
               href="{% querystring page=page_obj.previous_page_number %}">← Previous</a>
        {% endif %}
        <span>Page <strong>{{ page_obj.number }}</strong> of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="button button-quiet small"
               href="{% querystring page=page_obj.next_page_number %}">Next →</a>
        {% endif %}
    </nav>
{% endif %}
